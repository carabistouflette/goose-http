name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build python3 pkg-config libcurl4-openssl-dev openssl clang python3-h2
      - run: make setup
      - run: mkdir -p .build
      - run: make check test http2 metadata-test CC=gcc 2>&1 | tee .build/client-gcc-release-transcript.log
      - run: make clients CC=clang 2>&1 | tee .build/client-clang-release-transcript.log
      - run: make sanitize http2-sanitize metadata-sanitize SANITIZER_CC=gcc 2>&1 | tee .build/client-gcc-sanitize-transcript.log
      - run: make sanitize http2-sanitize metadata-sanitize SANITIZER_CC=clang 2>&1 | tee .build/client-clang-sanitize-transcript.log
      - run: make fuzz FUZZ_RUNS=10000
      - run: make metadata-fuzz
      - run: make metadata-fuzz-sanitize SANITIZER_CC=gcc
      - run: make metadata-fuzz-sanitize SANITIZER_CC=clang METADATA_FUZZ_SEED=492
      - run: make metadata-coverage-fuzz METADATA_COVERAGE_RUNS=10000
      - run: make bench BENCH_ITERATIONS=10
      - run: make profile PROFILE_BASELINE=HEAD PROFILE_ITERATIONS=100 PROFILE_SAMPLES=1
      - run: make metadata-bench METADATA_REQUESTS=2 METADATA_ITERATIONS=100 METADATA_SAMPLES=1
      - run: make reuse-bench CC=gcc REUSE_REQUESTS=5 REUSE_SAMPLES=2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-samples
          path: |
            .build/bench.json
            .build/profile-results.json
            .build/metadata-bench.json
            .build/metadata-fuzz-*results.json
            .build/metadata-fuzz-corpus.bin
            .build/metadata-fuzz-failure.bin
            .build/metadata-fuzz-crash.bin
            .build/reuse-results-*.json
            .build/client-native-*.json
            .build/client-api-*/compiler-commands.jsonl
            .build/client-*-transcript.log
          include-hidden-files: true
          if-no-files-found: error
